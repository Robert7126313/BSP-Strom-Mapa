[package]
name    = "BSP-Strom-Mapa"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow          = "1"
cgmath          = "0.18"
egui            = "0.29"
three-d         = { version = "0.18", features = ["window", "egui-gui"] }
three-d-asset   = { version = "0.9", features = ["png", "jpeg"] }
rfd             = { version = "0.9", default-features = false, features = ["xdg-portal"] }
gltf            = { version = "1.4", features = ["extras", "names"] }
rayon           = "1.10.0"
egui_plot       = "0.29"
once_cell       = "1.18"
log             = "0.4"
env_logger      = "0.11"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
